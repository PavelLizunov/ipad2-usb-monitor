[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipad2-usb-monitor"
version = "0.1.0"
description = "A tethered Linux framebuffer monitor for jailbroken iPad 2 K94AP and Omarchy"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "pyusb>=1.3"]
license = "MIT"

[project.scripts]
ipad-monitor = "ipad_usb_monitor.cli:main"

[tool.setuptools]
packages = ["ipad_usb_monitor"]
